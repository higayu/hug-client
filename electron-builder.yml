appId: com.higayu.hugclient
productName: Hug Client

directories:
  output: dist

files:
  - build/**/*
  - assets/**
  - electron/main/**
  - electron/preload/**
  - renderer/**
  - package.json

  # Electron が実行時に読む preload

  # 開発用ソース。実行時には不要だが、残してもOK

win:
  target: nsis
  icon: assets/favicon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Hug Client"

publish:
  provider: github
  owner: higayu
  repo: hug-client
  private: true
